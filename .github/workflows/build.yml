name: Build Auto-Board

# Laeuft taeglich + manuell ausloesbar. Ruft die Job-Feeds ab (auf GitHubs
# Servern, mit offenem Internet), baut index.html neu und committed sie.
# Abgelaufene Stellen fallen automatisch raus, weil nur reinkommt, was
# aktuell im Feed steht. Die manuelle Schicht (manual-jobs.json) bleibt.

on:
  schedule:
    - cron: "0 4 * * *"    # taeglich ~06:00 Uhr DE (04:00 UTC)
  workflow_dispatch: {}     # Knopf zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: build-auto-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Board bauen (Feeds -> index.html)
        # Adzuna ist optional: nur aktiv, wenn beide Secrets gesetzt sind
        # (Repo -> Settings -> Secrets and variables -> Actions -> ADZUNA_APP_ID / ADZUNA_APP_KEY).
        # Fehlen sie, laeuft der Build normal weiter und ueberspringt Adzuna.
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
        run: python build_auto.py
      - name: Aenderungen committen (nur wenn es welche gibt)
        run: |
          git config user.name  "missionfrei-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Keine Aenderung - nichts zu committen."
          else
            git commit -m "Auto-Update Board $(date -u +%F)"
            git push
          fi

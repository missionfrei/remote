<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finde deine Richtung – Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#14202B; --muted:#56646F; --line:#D8E0DE;
  --accent:#0D6B60; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --sun:#D99A12; --sun-soft:#FBF0D2; --warn:#9B2F46; --warn-soft:#F6E3E8;
  --rot:#D0433F; --gelb:#E0AA1E; --gruen:#3A9A5C; --blau:#2E6DB4;
  --display:"Bricolage Grotesque", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#15212B; --ink:#E7EEF0; --muted:#9AA9B3; --line:#263541;
    --accent:#45B8A6; --accent-ink:#06201C; --accent-soft:#143A34;
    --sun:#F0C04A; --sun-soft:#3A3117; --warn:#E58AA0; --warn-soft:#3A1E26;
    --rot:#E8635F; --gelb:#EDC04A; --gruen:#5DBB7D; --blau:#5B95D8; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo{filter:invert(1)}
  :root:not([data-theme="light"]) .cta .logo{filter:none}
}
:root[data-theme="dark"]{
  --bg:#0E161D; --surface:#15212B; --ink:#E7EEF0; --muted:#9AA9B3; --line:#263541;
  --accent:#45B8A6; --accent-ink:#06201C; --accent-soft:#143A34;
  --sun:#F0C04A; --sun-soft:#3A3117; --warn:#E58AA0; --warn-soft:#3A1E26;
  --rot:#E8635F; --gelb:#EDC04A; --gruen:#5DBB7D; --blau:#5B95D8; color-scheme:dark;
}
:root[data-theme="dark"] .logo{filter:invert(1)}
:root[data-theme="dark"] .cta .logo{filter:none}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-0.01em}
p{margin:0 0 1em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}
.logo{display:block;height:auto}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:26px 20px 24px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.brand .logo{width:34px;flex:none}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:0}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.prog-top b{color:var(--ink);font-weight:700}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font-size:15px;color:var(--muted)}
.toc button:hover:not(:disabled){background:var(--surface);color:var(--ink)}
.toc button:disabled{cursor:not-allowed;opacity:.45}
.toc button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.toc .dot{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.toc .done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toc .dot svg{width:14px;height:14px}
.nav-foot{margin-top:auto;font-size:13px;color:var(--muted)}

.mbar{display:none}
main{padding:56px 48px 120px;min-width:0}
.chapter{max-width:740px;margin:0 auto}
.chapter[hidden]{display:none}

@media (max-width:920px){
  .app{display:block}
  .nav{position:fixed;inset:0;z-index:40;height:100%;width:100%;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  .nav.open{transform:none}
  .nav-close{display:inline-flex!important}
  .mbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:14px;padding:12px 18px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--bg);border-bottom:1px solid var(--line)}
  .mbar .logo{width:24px;flex:none}
  .mbar .track{flex:1}
  .mbar button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .mbar .pct{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  main{padding:32px 20px 100px}
}
.nav-close{display:none;align-self:flex-end;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- chapter head ---------- */
.chhead{margin-bottom:40px}
.chnum{display:block;font-family:var(--display);font-weight:800;font-size:clamp(64px,11vw,104px);line-height:.85;color:var(--accent);letter-spacing:-0.04em;margin-bottom:18px;font-variant-numeric:tabular-nums}
.chhead h2{font-size:clamp(30px,4.6vw,46px);font-weight:700;margin-bottom:16px;max-width:18ch}
.chhead h2:focus{outline:none}
.lede{font-size:19px;color:var(--muted);max-width:60ch;margin:0}
.reqnote{font-size:14px;color:var(--muted);margin:14px 0 0}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:48px}
.hero .logo{width:62px;margin-bottom:22px}
.hero h1{font-size:clamp(46px,8vw,86px);font-weight:800;letter-spacing:-0.035em;line-height:.92;margin-bottom:18px}
.hero .sub{font-family:var(--display);font-size:clamp(20px,2.6vw,25px);font-weight:500;line-height:1.25;margin-bottom:22px}
.hero p.body{color:var(--muted);max-width:44ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-compass{max-width:380px;margin:0 auto;order:-1}}

/* ---------- blocks ---------- */
.q{margin:0 0 34px;border-radius:14px;transition:background .2s,box-shadow .2s}
.qt{font-weight:700;font-size:18px;margin:0 0 6px;line-height:1.35}
.hint{color:var(--muted);font-size:15px;margin:0 0 12px}
textarea,input[type="text"],input[type="date"],input[type="number"],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink);resize:vertical;line-height:1.5}
select{appearance:auto;cursor:pointer}
textarea{min-height:88px}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.75}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 26px 18px;margin:0 0 22px}
.panel h3{font-size:21px;font-weight:700;margin-bottom:6px}
.note{border-left:3px solid var(--sun);background:var(--sun-soft);padding:14px 18px;border-radius:0 12px 12px 0;margin:0 0 30px;font-size:16px}
.note b{font-weight:700}
.warnbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:14px 18px;border-radius:0 12px 12px 0;margin:0 0 24px;font-size:16px}

/* required / invalid */
.invalid textarea,.invalid input,.invalid select{border-color:var(--warn)}
.invalid .opt,.invalid .scale button{border-color:var(--warn)}
.q.invalid::after,.srow.invalid .sl::after,.prow.invalid span::after,.rc-row.invalid div:first-child::after{content:"Pflichtfeld";display:block;color:var(--warn);font-size:13px;font-weight:700;margin-top:6px}
.srow.invalid,.prow.invalid,.rc-row.invalid{background:var(--warn-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.err{display:none;margin:0;color:var(--warn);font-weight:600;font-size:15px}
.err.show{display:block}

/* options */
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.opts.stack{flex-direction:column;align-items:stretch}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font-size:16px;line-height:1.3;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .box{flex:none;width:21px;height:21px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;color:var(--accent-ink)}
.opt .box svg{width:14px;height:14px;opacity:0}
.opt.radio .box{border-radius:50%}
.opt.radio .box i{width:9px;height:9px;border-radius:50%;background:var(--accent-ink);opacity:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .box svg,.opt[aria-pressed="true"] .box i{opacity:1}

/* scales */
.scale{display:flex;gap:6px}
.scale button{flex:1 1 0;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted)}
.scale button:hover{border-color:var(--muted);color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale.s5{width:230px;flex:none}
.scale.s5 button{height:38px}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:center;padding:8px 0}
.prow span{font-weight:600;font-size:16px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .sl b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.srow .sl small{color:var(--muted);font-size:14px;line-height:1.3;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:0 0 18px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .prow{grid-template-columns:1fr;gap:6px;padding:10px 0}
  .srow{grid-template-columns:1fr}
  .scale.s5{width:100%}
}

/* result cards */
.result{background:var(--accent-soft);border-radius:20px;padding:24px 26px;margin:10px 0 28px}
.result h3{font-size:15px;font-family:var(--body);font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.result h3 svg{width:18px;height:18px}
.result .big{font-family:var(--display);font-size:clamp(22px,3.2vw,28px);font-weight:700;line-height:1.2;margin:0 0 10px}
.result p{margin:0 0 8px}
.result p:last-child{margin-bottom:0}
.result .empty{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.35}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.gbars{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.gbar{display:grid;grid-template-columns:130px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:14px}
.gbar .track{height:8px;background:var(--surface)}
.gbar b{text-align:right;font-variant-numeric:tabular-nums}

/* personality */
.models{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 30px}
.models div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.models h3{font-size:16px;margin-bottom:4px}
.models p{font-size:14px;color:var(--muted);margin:0}
@media (max-width:820px){.models{grid-template-columns:repeat(2,minmax(0,1fr))}}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 30px}
.sw{border-radius:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c)}
.sw b{display:block;font-family:var(--display);font-size:19px;margin-bottom:4px}
.sw p{font-size:14px;color:var(--muted);margin:0}
@media (max-width:720px){.swatches{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cbars{display:flex;flex-direction:column;gap:9px;margin:14px 0 16px}
.cbar{display:grid;grid-template-columns:70px minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:14px;font-weight:600}
.cbar .track{height:12px;background:var(--surface)}
.cbar .track i{background:var(--c)}
.cbar b{text-align:right;font-variant-numeric:tabular-nums}
.ptype{display:flex;gap:14px;align-items:flex-start;margin:14px 0}
.ptype .dotc{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c)}
.ptype h4{font-size:20px;margin-bottom:4px}
.ptype p{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:15px;margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb, var(--accent) 25%, transparent)}
.kv dt{font-weight:700}
.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:8px}}
.b5row .sl small{max-width:44ch}

/* category cards */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:18px}
.cat .ic{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cat .ic svg{width:26px;height:26px}
.cat h3{font-size:24px;font-weight:700;margin:4px 0 12px}
.cat ul{margin:0 0 14px;padding-left:18px}
.cat li{margin:2px 0}
.cat .lbl{font-weight:700;font-size:14px;color:var(--muted);margin:0 0 6px}
.cat .real{font-size:15px;color:var(--muted);margin:12px 0 16px}
.cat .fits{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin:0 0 12px}
.cat .fits i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
@media (max-width:560px){.cat{grid-template-columns:1fr}.cat .ic{width:44px;height:44px}}

/* compass */
.compass{width:100%;height:auto;display:block}
.compass .ring{fill:none;stroke:var(--line);stroke-width:1}
.compass .ring.outer{stroke:var(--muted);stroke-opacity:.45;stroke-width:1.5}
.compass .axis line{stroke:var(--line);stroke-width:1}
.compass .lab{font:600 12.5px var(--body);fill:var(--muted)}
.compass .lab.top{fill:var(--ink);font-weight:800}
.compass .area{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.compass .needle{transition:transform 1.6s cubic-bezier(.25,1.3,.35,1)}
.compass .n1{fill:var(--sun)}
.compass .n2{fill:var(--ink);opacity:.2}
.compass .hub{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.compass .tick{stroke:var(--muted);stroke-width:1.5;stroke-opacity:.5}

/* matching */
.match-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:34px}
@media (max-width:720px){.match-top{grid-template-columns:1fr}}
.scorelist{display:flex;flex-direction:column;gap:14px}
.sc{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 14px;align-items:center}
.sc .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.sc .nm svg{width:18px;height:18px;color:var(--accent)}
.sc .val{grid-row:span 2;text-align:right;font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sc .val small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500}
.sc .track{height:9px}
.sc.lead .track i{background:var(--sun)}
.sc .brk{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sc .brk .neg{color:var(--warn);font-weight:600}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:0 0 30px;font-size:15px}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:10px 0 4px;padding-left:18px}
details.how li{margin:4px 0}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 34px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.pod.first{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun)}
.pod .medal{font-size:30px;line-height:1}
.pod h4{font-size:20px;font-weight:700;margin:10px 0 4px}
.pod p{margin:0;color:var(--muted);font-size:14px}
@media (max-width:620px){.podium{grid-template-columns:1fr}}
.refl{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;margin:0 0 22px}
.refl-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.refl-head .medal{font-size:30px}
.refl-head h3{font-size:26px;font-weight:700}
.auto{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 10px}

/* reality */
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rc-row:first-of-type{border-top:0}
.rc-row b{display:block;font-size:16px}
.rc-row small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
@media (max-width:560px){.rc-row{grid-template-columns:1fr}}
.rc-sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:2px solid var(--ink);font-weight:700}
.rc-sum span:last-child{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}

/* plan */
.counter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;background:var(--ink);color:var(--bg);border-radius:18px;padding:18px 22px;margin:0 0 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 20px;align-items:center}
@media (max-width:920px){.counter{top:calc(env(safe-area-inset-top,0px) + 64px)}}
.counter .num{grid-row:span 2;font-family:var(--display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.counter .num small{font-size:18px;opacity:.7;font-weight:600}
.counter p{margin:0;font-weight:600;font-size:15px}
.counter .track{background:color-mix(in srgb, var(--bg) 25%, transparent);height:10px}
.counter .track i{background:var(--sun)}
.day{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:4px}
.day .dn{width:58px;text-align:center}
.day .dn span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.day .dn b{display:block;font-family:var(--display);font-size:34px;font-weight:800;line-height:1;color:var(--accent)}
.day h4{font-size:19px;font-weight:700;margin:2px 0 6px}
.day p{color:var(--muted);font-size:15px;margin:0 0 12px}
.day .target{display:inline-block;background:var(--sun-soft);color:var(--ink);font-weight:700;font-size:14px;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.day .row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.day .row2 label{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.day .row2 input{width:86px;padding:8px 10px}
.day.is-done h4{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
@media (max-width:560px){.day{grid-template-columns:1fr;gap:6px}.day .dn{text-align:left;display:flex;align-items:baseline;gap:8px;width:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--line)}
.chnav{margin-top:48px;padding-top:26px;border-top:1px solid var(--line)}
.chnav .row{display:flex;justify-content:space-between;gap:12px}
.chnav .err{margin-top:14px;text-align:right}

.how3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 30px}
.how3 div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.how3 h3{font-size:18px;margin-bottom:6px}
.how3 p{font-size:15px;color:var(--muted);margin:0}
@media (max-width:720px){.how3{grid-template-columns:1fr}}

.closing{font-family:var(--display);font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.18;letter-spacing:-0.015em;margin:0 0 28px;max-width:22ch}
.closing span{display:block;color:var(--muted);font-weight:500}
.cta{background:var(--ink);color:var(--bg);border-radius:24px;padding:34px 32px;margin:40px 0 30px}
.cta .logo{width:44px;margin-bottom:18px;filter:invert(1)}
.cta p{color:var(--bg);opacity:.85;max-width:58ch}
.cta h3{font-size:clamp(22px,3vw,28px);font-weight:700;margin:6px 0 20px;max-width:26ch;color:var(--bg)}
.cta .btn{background:transparent;border-color:color-mix(in srgb, var(--bg) 50%, transparent);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools small{color:var(--muted);font-size:13px;flex-basis:100%}

@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .nav,.mbar,.chnav,.noprint{display:none!important}
  .app{display:block}
  main{padding:0}
  .chapter,.chapter[hidden]{display:block!important;page-break-before:always}
  .chapter:first-child{page-break-before:auto}
  .panel,.cat,.refl,.result,.pod,.sw{break-inside:avoid}
  .counter{position:static}
  .logo{filter:none!important}
  .cta{background:#fff;color:#000;border:2px solid #000}
  .cta p,.cta h3{color:#000}
}
</style>
</head>

/* Eingebettet ins Job-Board (Lauf #137): der Speicher haengt am Login-Passwort,
   genau wie mf_fav_<pw> und mf_bew_<pw> im Board. Ohne Passwort faellt es auf den
   alten globalen Schluessel zurueck, damit die Datei auch einzeln benutzbar bleibt. */
const FDR_PW = (function(){
  try{
    var u=new URLSearchParams(location.search).get("pw");
    if(u) return u.replace(/[^a-z0-9_-]/gi,"");
    var l=localStorage.getItem("mf_pw");
    if(l) return l.replace(/[^a-z0-9_-]/gi,"");
  }catch(e){}
  return "";
})();
const KEY = FDR_PW ? ("fdr_"+FDR_PW) : "fdr-workbook-v2";
const PROFKEY = FDR_PW ? ("fdr_prof_"+FDR_PW) : "fdr_prof_";
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && typeof o === "object") return o; } }catch(e){}
  return {};
}
if(!S.visited) S.visited = {};
if(!S.tried) S.tried = {};
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  try{ saveProfile(); }catch(e){}
}
/* Das Board kann die Funktionen hier drin nicht aufrufen (eigenes Dokument im iframe),
   deshalb legt das Workbook selbst eine kompakte Auswertung ab. Das Board liest nur
   diese eine Struktur - damit haengt es nicht an den Interna des Workbooks. */
function saveProfile(){
  if(typeof scores!=="function") return;
  var r;
  try{ r = ranked(); }catch(e){ return; }
  var cats={}; r.forEach(function(c){ cats[c.id]=c.total; });
  var sk = get("p3.skills")||{};
  var stark=[]; for(var k in sk){ if(sk[k]>=4) stark.push(k); }
  var out={
    v:2,
    pw:FDR_PW,
    ts:Date.now(),
    /* Wie viel wirklich beantwortet wurde. Ohne diese Zahl haelt das Board ein leeres
       Workbook faelschlich fuer ausgefuellt: scores() gibt jeder Richtung +2 dafuer, dass
       kein No-Go dagegen steht - acht Richtungen mal zwei sieht nach Ergebnis aus. */
    sub:(get("p2.acts")||[]).length + Object.keys(sk).length + Object.keys(get("p4")||{}).length,
    cats:cats,
    top:r.slice(0,3).map(function(c){return c.id;}),
    jobs:r.slice(0,3).reduce(function(a,c){return a.concat(c.jobs||[]);},[]),
    choice:get("p9.choice")||"",
    nogos:get("p5.nogos")||[],
    skills:stark,
    /* Sprachstufe fuers Board: entscheidet, ob englische Stellen ueberhaupt auftauchen.
       1-2 nur deutsche Karten, 3 englische sichtbar aber ohne Bonus, 4-5 voll dabei. */
    en:(+sk.k_englisch||0),
    style:get("p4")||{},
    prios:(function(){ try{ return topPrios().map(function(p){return p.name;}); }catch(e){ return []; } })(),
    fertig:(function(){ try{ return Object.keys(S.visited||{}).length; }catch(e){ return 0; } })()
  };
  try{ localStorage.setItem(PROFKEY, JSON.stringify(out)); }catch(e){}
}
function get(path){ return path.split(".").reduce((o,k)=> o==null ? undefined : o[k], S); }
function set(path,val){
  const ks = path.split("."); let o = S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null || typeof o[ks[i]]!=="object") o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length-1];
  if(val===undefined || val==="") delete o[last]; else o[last] = val;
  save();
}
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function filled(k){
  if(k==="p5.nogos") return (get("p5.nogos")||[]).length>0 || get("p5.none")===true;
  const v = get(k);
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==="string") return v.trim().length>0;
  return v!=null;
}
function reqKeys(n){
  switch(n){
    case C.persona: return [...COLORQ.map((_,i)=>"px.c"+(i+1)),"px.mbti","px.disg","px.ennea",...B5.map(b=>"px.b5."+b[0])];
    case C.stand: return ["p1.why","p1.change","p1.annoy","p1.adv",...PRIOS.map(p=>"p1.prio."+p[0])];
    case C.like: return ["p2.acts","p2.help","p2.easy","p2.flow","p2.hate"];
    case C.skills: return [...SKILLKEYS.map(k=>"p3.skills."+k),"p3.where"];
    case C.style: return STYLEQ.map(q=>"p4."+q[0]);
    case C.nogo: return ["p5.nogos","p5.extra"];
    case C.dirs: return ["p6.likes"];
    case C.match: return top3().flatMap(c=>["why","skills","learn","like","long"].map(f=>`p7.${c.id}.${f}`));
    case C.reality: return top3().flatMap(c=>[...RC.map(r=>`p8.${c.id}.${r[0]}`),`p8.${c.id}.todo`]);
    case C.plan: return ["p9.choice","p9.goal","p9.start","p9.first"];
  }
  return [];
}
const missing = n => reqKeys(n).filter(k=>!filled(k));
function reach(){ for(let i=1;i<LAST;i++) if(missing(i).length) return i; return LAST; }
function markInvalid(n){
  const sec = document.getElementById("ch"+n); if(!sec) return;
  const miss = S.tried[n] ? missing(n) : [];
  sec.querySelectorAll("[data-req]").forEach(el=> el.classList.toggle("invalid", miss.includes(el.dataset.req)));
  const err = sec.querySelector(".err");
  if(err){
    err.classList.toggle("show", miss.length>0);
    err.textContent = miss.length ? `Noch ${miss.length} ${pl(miss.length,"Pflichtfeld","Pflichtfelder")} offen. Die markierten Felder fehlen.` : "";
  }
}
function tryNext(n){
  const miss = missing(n);
  if(!miss.length){ go(n+1); return; }
  S.tried[n] = true; save(); markInvalid(n);
  const first = document.querySelector(`#ch${n} .invalid`);
  if(first){ first.scrollIntoView({behavior:"smooth",block:"center"}); const f = first.querySelector("textarea,input,select,button"); if(f) setTimeout(()=>f.focus({preventScroll:true}),350); }
}

const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function opt(key,val,label,type){
  const on = type==="multi" ? (get(key)||[]).includes(val) : get(key)===val;
  return `<button type="button" class="opt${type==="single"?" radio":""}" data-k="${key}" data-v="${val}" data-type="${type}" aria-pressed="${on}"><span class="box">${type==="multi"?CHECK:"<i></i>"}</span><span>${label}</span></button>`;
}
function scale(key,max,cls){
  let h = `<div class="scale ${cls||""}" role="group">`;
  for(let i=1;i<=max;i++) h += `<button type="button" data-k="${key}" data-v="${i}" data-type="scale" aria-pressed="${get(key)===i}" aria-label="${i} von ${max}">${i}</button>`;
  return h + "</div>";
}
function ta(key,label,ph,rows){
  return `<textarea data-k="${key}" rows="${rows||3}" aria-label="${esc(label)}" aria-required="true" placeholder="${esc(ph)}">${esc(get(key)||"")}</textarea>`;
}

function foot(n){

  const next = n<LAST ? `<button type="button" class="btn" data-next="${n}">Weiter: ${CH[n+1].s}</button>` : "";

}

/* ======================================================
   Kompass
   ====================================================== */
function compass(sc, animate){
  const R = 100, map = {};
  (sc||[]).forEach(c=>map[c.id]=c.total);
  const order = [...CATS].sort((a,b)=>a.angle-b.angle);
  let top = null;
  if(sc && sc.length){ const r = [...sc].sort((a,b)=>b.raw-a.raw); if(r[0].raw>0) top = r[0]; }
  let rings = "", axes = "", labels = "", pts = [], ticks = "";
  [.25,.5,.75,1].forEach(f=> rings += `<circle r="${R*f}" class="ring${f===1?" outer":""}"/>`);
  for(let d=0; d<360; d+=15){ if(d%45===0) continue; const a=(d-90)*Math.PI/180; ticks += `<line class="tick" x1="${(Math.cos(a)*(R-4)).toFixed(1)}" y1="${(Math.sin(a)*(R-4)).toFixed(1)}" x2="${(Math.cos(a)*R).toFixed(1)}" y2="${(Math.sin(a)*R).toFixed(1)}"/>`; }
  order.forEach(c=>{
    const a = (c.angle-90)*Math.PI/180, x = Math.cos(a), y = Math.sin(a);
    axes += `<line x1="0" y1="0" x2="${(x*R).toFixed(1)}" y2="${(y*R).toFixed(1)}"/>`;
    const v = sc ? (map[c.id]||0)/20 : 0;
    pts.push(`${(x*R*v).toFixed(1)},${(y*R*v).toFixed(1)}`);
    const lx = x*(R+14), ly = y*(R+14);
    const anchor = Math.abs(x)<.2 ? "middle" : (x>0 ? "start" : "end");
    const n = c.lines.length, lh = 14;
    const sy = y<-.2 ? ly-(n-1)*lh-4 : (y>.2 ? ly+13 : ly+4-(n-1)*lh/2);
    labels += `<text class="lab${top&&top.id===c.id?" top":""}" x="${lx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="${anchor}">` +
      c.lines.map((l,i)=>`<tspan x="${lx.toFixed(1)}" dy="${i?lh:0}">${l}</tspan>`).join("") + `</text>`;
  });
  const deg = top ? top.angle : 28;
  const area = sc ? `<polygon class="area" points="${pts.join(" ")}"/>` : "";
  const aria = top ? `Richtungskompass: Deine Nadel zeigt auf ${top.name}` : "Richtungskompass mit acht Remote-Richtungen";
  return `<svg class="compass" viewBox="-195 -142 390 284" role="img" aria-label="${aria}">
    ${rings}<g class="axis">${axes}</g>${ticks}${area}
    <g class="needle" data-deg="${deg}" style="transform:rotate(${animate?0:deg}deg)">
      <path class="n1" d="M0,-86 L8,0 L0,12 L-8,0 Z"/><path class="n2" d="M0,-86 L8,0 L0,0 Z"/>
    </g><circle r="5" class="hub"/>${labels}</svg>`;
}
function spinNeedles(root){
  root.querySelectorAll(".needle").forEach(n=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.style.transform = `rotate(${n.dataset.deg}deg)`; }));
  });
}

   Auswertung

function colorProfile(){
  const cnt = {rot:0,gelb:0,gruen:0,blau:0}; let n = 0;
  COLORQ.forEach((_,i)=>{ const v = get("px.c"+(i+1)); if(v){ cnt[v]++; n++; } });
  const order = CKEYS.slice().sort((a,b)=>cnt[b]-cnt[a]);
  return {cnt, n, dom: n ? order[0] : null, sec: n && cnt[order[1]]>0 ? order[1] : null, tie: n && cnt[order[0]]===cnt[order[1]]};
}
function styleMatch(q,want,got){
  if(!got) return 0;
  if(got===want) return 1;
  if(q==="q4") return ((want==="flex"&&got==="frei")||(want==="frei"&&got==="flex")) ? .5 : 0;
  if(got==="mix"||want==="mix") return .5;
  return 0;
}
function scores(){
  const acts = get("p2.acts")||[], sk = get("p3.skills")||{}, st = get("p4")||{}, ng = get("p5.nogos")||[];
  const cp = colorProfile(), b5 = get("px.b5")||{};
  return CATS.map(c=>{
    const interest = Math.min(6, c.acts.filter(a=>acts.includes(a)).length*2);
    const rated = c.skills.map(s=>sk[s]).filter(v=>v);
    const skill = rated.length ? (rated.reduce((a,b)=>a+b,0)/rated.length-1)/4*8 : 0;
    let style = 0; for(const q in c.style) style += styleMatch(q,c.style[q],st[q]);
    const colorPts = cp.dom && c.colors.includes(cp.dom) ? 2 : (cp.sec && c.colors.includes(cp.sec) ? 1 : 0);
    const br = c.b5.map(t=>b5[t]).filter(v=>v);
    const b5Pts = br.length ? (br.reduce((a,b)=>a+b,0)/br.length-1)/4*2 : 0;
    const persona = colorPts + b5Pts;
    const conf = c.nogos.filter(n=>ng.includes(n));
    const nogo = Math.max(-4, 2-2*conf.length);
    const raw = interest+skill+style+persona+nogo;
    return {...c, interest, skill, style, persona, colorPts, b5Pts, nogo, conf, raw, total:Math.max(0,Math.min(20,Math.round(raw/24*20)))};
  });
}
function ranked(){ return scores().sort((a,b)=> b.raw-a.raw || b.skill-a.skill || b.interest-a.interest); }
const top3 = () => ranked().slice(0,3);
function topPrios(){
  const p = get("p1.prio")||{};
  return PRIOS.filter(x=>p[x[0]]).map(x=>({name:x[1],v:p[x[0]]})).sort((a,b)=>b.v-a.v).slice(0,3);
}
function groupAvgs(){
  const sk = get("p3.skills")||{};
  return SKILLGROUPS.map(g=>{ const r = g.items.map(i=>sk[i[0]]).filter(v=>v); return {name:g.name, avg: r.length ? r.reduce((a,b)=>a+b,0)/r.length : 0, n:r.length}; });
}

  if(cp.n<10) h += `<p class="empty">Noch ${10-cp.n} ${pl(10-cp.n,"Frage","Fragen")} im Farbtest offen.</p>`;

    kv += `<dt>Big Five</dt><dd>${hi.length?`Stark ausgeprägt: ${joinNames(hi)}.`:"Keine Eigenschaft mit 4 oder 5 bewertet – eher ausgeglichen."}</dd>`;
  }

  }

  let h = `<div class="match-top"><div>${compass(sc,true)}</div><div class="scorelist">` +
    sc.map((c,i)=>`<div class="sc${i===0&&c.raw>0?" lead":""}">
      <span class="nm">${icon(c.id)}${c.name}</span>
      <span class="val">${c.total}<small> / 20</small></span>
      <div class="track"><i style="width:${c.total/20*100}%"></i></div>
      <div class="brk"><span>Persönlichkeit ${fmt(c.persona)}/4</span><span>Interessen ${fmt(c.interest)}/6</span><span>Skills ${fmt(c.skill)}/8</span><span>Arbeitsweise ${fmt(c.style)}/4</span><span class="${c.nogo<2?"neg":""}">No-Go-Check ${c.nogo>0?"+":""}${fmt(c.nogo)}</span></div>
    </div>`).join("") + `</div></div>`;

    <ul>

      <li><b>Interessen (bis 6):</b> Jede Richtung hat drei typische Tätigkeiten aus ${K(C.like)}. Pro angekreuzter Tätigkeit gibt es 2 Punkte.</li>
      <li><b>Skills (bis 8):</b> Jede Richtung hat vier Kern-Skills aus ${K(C.skills)}. Dein Durchschnitt darin wird auf 0 bis 8 umgerechnet.</li>
      <li><b>Arbeitsweise (bis 4):</b> Vier Fragen aus ${K(C.style)} sind für jede Richtung besonders wichtig. Volle Übereinstimmung = 1 Punkt, teilweise = ½ Punkt.</li>
      <li><b>No-Go-Check (+2 bis −4):</b> Ohne Konflikte gibt es 2 Punkte. Jedes No-Go aus ${K(C.nogo)}, das in dieser Richtung typisch ist, zieht 2 Punkte ab.</li>
    </ul>
    <p style="margin:6px 0 0;color:var(--muted)">Maximal 24 Rohpunkte, auf 20 umgerechnet. MBTI, DISG und Enneagramm zählen nicht mit, weil nicht jeder sie kennt – sie ergänzen dein Profil. Das Ganze ist ein Orientierungswerkzeug, keine Diagnose. Zwei Punkte Unterschied sind kein Urteil.</p>
  </details>`;
  h += `<h3 style="font-size:28px;margin:0 0 16px">Deine Top 3 Richtungen</h3><div class="podium">` +
    t3.map((c,i)=>`<div class="pod${i===0?" first":""}"><span class="medal" aria-hidden="true">${MEDALS[i]}</span><h4>${c.name}</h4><p>${c.total} von 20 Punkten${likes.includes(c.id)?" – auch dein Bauchgefühl":""}</p></div>`).join("") + `</div>`;
  if(likes.length){

    let msg = "";
    if(both.length) msg += `Dein Bauchgefühl aus ${K(C.dirs)} und dein Ergebnis treffen sich bei <b>${joinNames(both.map(i=>CATBY[i].name))}</b>. Das ist ein gutes Zeichen. `;
    if(only.length) msg += `Du hattest auch <b>${joinNames(only.map(i=>CATBY[i].name))}</b> markiert, ${pl(only.length,"das landet","die landen")} aber nicht in deinen Top 3. Schau in die Punkte oben: Fehlen dir Skills, die du lernen könntest? Dann bleib dran. Passt die Arbeitsweise nicht oder kollidiert es mit No-Gos? Dann ist das ein wichtiger Hinweis.`;
    h += `<div class="note">${msg}</div>`;
  }
  h += `<p class="hint" style="margin-bottom:22px">Nimm dir für jede deiner Top 3 ein paar Minuten. Die Hinweise sind aus deinen Antworten berechnet – deine eigene Einschätzung ist wichtiger.</p>`;
  t3.forEach((c,i)=>{
    const strong = c.skills.filter(s=>sk[s]>=4).map(s=>SKILLNAME[s]);

    const k = "p7."+c.id+".";
    const colorLine = cp.dom ? (c.colors.includes(cp.dom) ? `Passt zu deinem Farbtyp ${COLORS[cp.dom].name}.` : (cp.sec && c.colors.includes(cp.sec) ? `Passt zu deinem ${COLORS[cp.sec].name}-Anteil.` : `Typisch eher für ${joinNames(c.colors.map(x=>COLORS[x].name))} – dein Farbtyp ist ${COLORS[cp.dom].name}. Das schließt nichts aus, aber achte im Alltag darauf.`)) : "";
    h += `<section class="refl">

      <div class="q" data-req="${k}why"><p class="qt">Warum könnte das zu mir passen?</p>${colorLine?`<div class="auto"><b>Persönlichkeit:</b> ${colorLine}</div>`:""}${ta(k+"why","Warum könnte das zu mir passen?","Was reizt dich daran? Was davon kennst du schon aus deinem Leben?")}</div>
      <div class="q" data-req="${k}skills"><p class="qt">Welche meiner Skills passen dazu?</p>
        <div class="auto"><b>Aus deiner Skill-Matrix:</b> ${strong.length?joinNames(strong)+" (4 oder 5 bewertet)":"Keiner der vier Kern-Skills ist bei dir mit 4 oder 5 bewertet. Überleg, ob du dich unterschätzt hast."}</div>
        ${ta(k+"skills","Welche meiner Skills passen dazu?","Ergänze, was die Matrix nicht erfasst: konkrete Erfahrungen, Beispiele, Tools …")}</div>
      <div class="q" data-req="${k}learn"><p class="qt">Was müsste ich noch lernen?</p>
        <div class="auto"><b>Mögliche Lücken:</b> ${weak.length?joinNames(weak):"In den Kern-Skills keine größeren Lücken. Schau in echten Stellenanzeigen, welche Tools verlangt werden."}</div>
        ${ta(k+"learn","Was müsste ich noch lernen?","Was genau, und wie könntest du es lernen?")}</div>

    </section>`;
  });
  el.innerHTML = h;
  spinNeedles(el);
}

function rReality(){
  const el = document.getElementById("dReality"); if(!el) return;

  let h = `<div class="note"><b>Wichtig:</b> Dein Ergebnis ist keine Garantie dafür, dass du in diesem Bereich einen Job bekommst. Es zeigt dir lediglich, welche Richtungen auf Basis deiner Antworten sinnvoll sein könnten, die du als Nächstes prüfen solltest.</div>`;
  h += `<p class="hint">Bewerte jede Richtung von 1 bis 5. Du weißt etwas noch nicht, zum Beispiel beim Einkommen oder den Einstiegschancen? Gib eine vorläufige Einschätzung und schreib auf, was du recherchieren musst.</p>`;
  const ctx = [];
  if(pr.length) ctx.push(`Prioritäten: <b style="color:var(--ink)">${joinNames(pr.map(p=>p.name))}</b>`);

  if(ctx.length) h += `<p class="hint">Denk bei „Persönliche Passung“ an dein Profil – ${ctx.join(", ")}.</p>`;
  t3.forEach((c,i)=>{
    h += `<div class="panel"><h3>${MEDALS[i]} ${c.name}</h3><p class="hint" style="margin-bottom:8px">Matching: ${c.total} / 20 – Skill-Score aus deinen Antworten: ${fmt(c.skill)} / 8</p>` +
      RC.map(r=>`<div class="rc-row" data-req="p8.${c.id}.${r[0]}"><div><b>${r[1]}</b><small>${r[2]}</small></div>${scale(`p8.${c.id}.${r[0]}`,5,"s5")}</div>`).join("") +
      `<div class="rc-sum"><span>Reality-Check-Wert</span><span id="rcs-${c.id}"></span></div>` +
      `<div class="q" data-req="p8.${c.id}.todo" style="margin:18px 0 8px"><p class="qt" style="font-size:16px">Was muss ich dazu noch herausfinden?</p>${ta(`p8.${c.id}.todo`,"Was muss ich noch herausfinden?","z. B. Welche Gehälter stehen in Anzeigen? Wird Englisch verlangt? Geht das auch von Spanien aus?",2)}</div></div>`;

function rcTotals(){
  const t3 = top3();
  t3.forEach(c=>{ const e = document.getElementById("rcs-"+c.id); if(e) e.textContent = `${rcSum(c.id).s} / 35`; });
  const el = document.getElementById("rcTotals"); if(!el) return;
  const rows = t3.map(c=>({c, ...rcSum(c.id)})), complete = rows.filter(r=>r.n===7);
  let h = rh("Dein Reality Check");
  h += `<div class="gbars">${rows.map(r=>`<div class="gbar"><span>${r.c.name}</span><div class="track"><i style="width:${r.s/35*100}%"></i></div><b>${r.s}</b></div>`).join("")}</div>`;
  if(complete.length){
    const best = [...complete].sort((a,b)=>b.s-a.s)[0];
    h += `<p class="big" style="margin-top:16px">Im Reality Check vorne: ${best.c.name}.</p>`;
    if(best.c.id!==t3[0].id) h += `<p>Dein Matching sah ${t3[0].name} vorne. Das ist kein Widerspruch: Das Matching zeigt, was zu dir passt – der Reality Check, was gerade realistisch ist. Beides zusammen ist deine Entscheidungsgrundlage.</p>`;
  } else h += `<p class="empty" style="margin-top:12px">Bewerte die Richtungen in allen sieben Punkten.</p>`;
  el.innerHTML = h;
}

/* ======================================================
   Bewerbungswoche
   ====================================================== */
function suggested(){
  const t3 = top3();
  const done = t3.map(c=>({c,...rcSum(c.id)})).filter(r=>r.n===7).sort((a,b)=>b.s-a.s);
  return done.length ? done[0].c : t3[0];
}

  const c = CATBY[choice], done = get("p9.done")||[], tg = dayTargets(goal);
  h += `<div class="note"><b>Ehrlich gesagt:</b> Die meisten Bewerbungen bleiben unbeantwortet – das ist normal und sagt oft wenig über dich aus. Deshalb brauchst du beides: genug Volumen und ein System, mit dem jede Bewerbung schnell geht, ohne beliebig zu werden.</div>`;
  h += `<div class="counter" aria-live="polite"><span class="num" id="sentNum">${sentTotal()}<small> / ${goal}</small></span><p id="sentTxt"></p><div class="track"><i id="sentBar" style="width:0%"></i></div></div>`;
  h += `<div class="panel"><h3 style="margin-bottom:4px">Deine Bewerbungswoche: ${c.name}</h3><p class="hint">Trag jeden Tag ein, wie viele Bewerbungen rausgegangen sind, und hak den Tag ab. Die Tagesfelder füllst du während der Woche aus.</p>` +
    DAYS.map((d,i)=>{ const n = String(i+1), isD = done.includes(n);
      return `<div class="day${isD?" is-done":""}" data-day="${n}">
        <div class="dn"><span>Tag</span><b>${n}</b></div>
        <div><h4>${d.t}</h4>${tg[i]?`<span class="target">Ziel heute: ${tg[i]} ${pl(tg[i],"Bewerbung","Bewerbungen")}</span>`:`<span class="target">Heute: Pipeline aufbauen</span>`}<p>${d.tip(c)}</p>
        <textarea data-k="p9.notes.d${n}" data-opt="1" rows="2" aria-label="${esc(d.t)}" placeholder="${esc(d.ph)}">${esc(get("p9.notes.d"+n)||"")}</textarea>
        <div class="row2"><label>Heute versendet <input type="number" min="0" inputmode="numeric" data-k="p9.sent.d${n}" data-opt="1" value="${esc(get("p9.sent.d"+n)||"")}"></label>${opt("p9.done",n,"Tag erledigt","multi")}</div></div>
      </div>`; }).join("") + `</div>`;
  el.innerHTML = h;
  updateSent();
}
function updateSent(){
  const goal = parseInt(get("p9.goal"),10); if(!goal) return;
  const s = sentTotal(), num = document.getElementById("sentNum"), bar = document.getElementById("sentBar"), txt = document.getElementById("sentTxt");
  if(num) num.innerHTML = `${s}<small> / ${goal}</small>`;
  if(bar) bar.style.width = Math.min(100, s/goal*100) + "%";
  if(txt) txt.textContent = s>=goal ? "Wochenziel erreicht. Leg fürs nächste Mal eine Schippe drauf." : `Bewerbungen versendet – noch ${goal-s} bis zu deinem Wochenziel.`;
}

/* ======================================================
   Abschluss
   ====================================================== */
function rEnd(){
  const el = document.getElementById("dEnd"); if(!el) return;
  const t3 = top3(), ch = get("p9.choice"), st = get("p9.start"), first = get("p9.first"), goal = get("p9.goal"), cp = colorProfile();
  let h = `<div class="result">${rh("Deine Richtung auf einen Blick")}`;
  h += `<p class="big">${t3.map((c,i)=>`${MEDALS[i]} ${c.name}`).join("&ensp;")}</p>`;
  if(cp.dom) h += `<p>Persönlichkeit: Farbtyp <b>${COLORS[cp.dom].name}</b>${cp.sec?` mit ${COLORS[cp.sec].name}-Anteil`:""}${get("px.mbti")&&get("px.mbti")!=="unknown"?`, MBTI <b>${get("px.mbti")}</b>`:""}.</p>`;
  if(ch && CATBY[ch]) h += `<p>Du bewirbst dich zuerst auf <b>${CATBY[ch].name}</b>${goal?` – Ziel: <b>${goal} Bewerbungen</b> in 7 Tagen`:""}${st?`, Start am <b>${new Date(st+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}</b>`:""}.</p>`;
  if(first) h += `<p>Dein erster Schritt: ${esc(first)}</p>`;
  const s = sentTotal(); if(s) h += `<p>Bisher versendet: <b>${s}</b> ${pl(s,"Bewerbung","Bewerbungen")}.</p>`;
  el.innerHTML = h + `</div>`;
}

/* ======================================================
   Fortschritt & Navigation
   ====================================================== */
function isDone(n){
  if(n===0) return !!S.visited[0];
  if(n===LAST) return !!S.visited[LAST];
  return reqKeys(n).length>0 && missing(n).length===0;
}
function renderProgress(){
  let d = 0; for(let i=0;i<=LAST;i++) if(isDone(i)) d++;
  const p = Math.round(d/(LAST+1)*100), r = reach();
  ["prog","mprog"].forEach(id=>{ const e=document.getElementById(id); if(e) e.style.width = p+"%"; });
  ["pct","mpct"].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent = p+" %"; });
  document.getElementById("toc").innerHTML = CH.map((c,i)=>{
    const done = isDone(i), locked = i>r;
    return `<li class="${done?"done":""}"><button type="button" data-go="${i}" aria-current="${S.cur===i}" ${locked?"disabled":""}><span class="dot">${done?CHECK:(i===0?"◦":i===LAST?"✦":i)}</span>${c.s}</button></li>`;
  }).join("");
  const ob = document.getElementById("openNav"); if(ob) ob.textContent = S.cur===0 ? "Kapitel" : (S.cur===LAST ? "Abschluss" : `Kapitel ${String(S.cur).padStart(2,"0")}`);
}
function updateLive(){ evP(); ev1(); ev2(); ev3(); ev4(); ev5(); renderProgress(); if(S.cur) markInvalid(S.cur); }
function renderDyn(n){ if(n===C.match) rMatch(); if(n===C.reality) rReality(); if(n===C.plan) rPlan(); if(n===LAST) rEnd(); }

const BUILD = [ch0,chPersona,chStand,chLike,chSkills,chStyle,chNogo,chDirs,chMatch,chReality,chPlan,chEnd];
function build(){
  document.getElementById("main").innerHTML = BUILD.map((f,i)=>`<section class="chapter" id="ch${i}" data-ch="${i}" hidden>${f()}</section>`).join("");
}
function go(n){
  n = Math.max(0,Math.min(LAST,n));
  const r = reach(); if(n>r) n = r;
  S.cur = n; if(n>0) S.resume = n; S.visited[n] = true; save();
  document.querySelectorAll(".chapter").forEach(s=> s.hidden = Number(s.dataset.ch)!==n);
  if(n===0) document.getElementById("ch0").innerHTML = ch0();
  renderDyn(n); updateLive();
  document.getElementById("nav").classList.remove("open");
  window.scrollTo(0,0);
  const h = document.querySelector(`#ch${n} h2`); if(h && n>0) h.focus({preventScroll:true});
}

/* ======================================================
   Events
   ====================================================== */
function syncButtons(key){
  document.querySelectorAll(`[data-type][data-k="${key}"]`).forEach(b=>{
    const t = b.dataset.type, v = b.dataset.v; let on;
    if(t==="multi") on = (get(key)||[]).includes(v);
    else if(t==="scale") on = get(key)===Number(v);
    else if(b.dataset.bool) on = get(key)===true;
    else on = get(key)===v;
    b.setAttribute("aria-pressed", on);
  });
}
function onChange(k){
  if(k==="p9.choice" || k==="p9.goal") rPlan();
  if(k==="p9.done"){ const d = get("p9.done")||[]; document.querySelectorAll(".day").forEach(e=>e.classList.toggle("is-done", d.includes(e.dataset.day))); }
  if(k.startsWith("p9.sent")) updateSent();
  if(k.startsWith("p8.")) rcTotals();
  updateLive();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("button[data-type]");
  if(b){
    const k = b.dataset.k, v = b.dataset.v, t = b.dataset.type;
    if(t==="multi"){ const a = (get(k)||[]).slice(); const i = a.indexOf(v); i>=0 ? a.splice(i,1) : a.push(v); set(k, a.length ? a : undefined); }
    else if(t==="scale"){ const n = Number(v); set(k, get(k)===n ? undefined : n); }
    else if(b.dataset.bool){ set(k, get(k)===true ? undefined : true); }
    else set(k, get(k)===v ? undefined : v);
    if(k==="p5.nogos" && (get("p5.nogos")||[]).length){ set("p5.none", undefined); syncButtons("p5.none"); }
    if(k==="p5.none" && get("p5.none")){ set("p5.nogos", undefined); syncButtons("p5.nogos"); }
    syncButtons(k); onChange(k); return;
  }
  const nx = e.target.closest("[data-next]");
  if(nx){ tryNext(Number(nx.dataset.next)); return; }
  const g = e.target.closest("[data-go]");
  if(g){ e.preventDefault(); if(!g.disabled) go(Number(g.dataset.go)); return; }
  if(e.target.closest("#openNav")){ document.getElementById("nav").classList.add("open"); return; }
  if(e.target.closest("#closeNav")){ document.getElementById("nav").classList.remove("open"); return; }
  if(e.target.closest("#printBtn")){ [C.match,C.reality,C.plan,LAST].forEach(renderDyn); updateLive(); try{ window.print(); }catch(err){} return; }
  const rb = e.target.closest("#resetBtn");
  if(rb){
    if(rb.dataset.armed){ S = {visited:{}, tried:{}}; save(); build(); go(0); }
    else { rb.dataset.armed = "1"; rb.textContent = "Wirklich alles löschen? Nochmal klicken"; setTimeout(()=>{ if(rb.isConnected){ delete rb.dataset.armed; rb.textContent = "Alle Antworten löschen"; } }, 4000); }
  }
});
function onField(e){
  const el = e.target;
  if(el && el.dataset && el.dataset.k && !el.dataset.type){ set(el.dataset.k, el.value); onChange(el.dataset.k); }
}
document.addEventListener("input", onField);
document.addEventListener("change", e=>{ if(e.target.tagName==="SELECT") onField(e); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("nav").classList.remove("open"); });

build();
go(typeof S.cur==="number" ? S.cur : 0);
</script>
</body>
